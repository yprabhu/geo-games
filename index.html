<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geo Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geo Games">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>🌍 Geo Games</h1>
<div class="tabs" id="tabs"></div>
<div class="stats">
<div class="stat"><b id="score">0</b><span>Points</span></div>
<div class="stat"><b id="streak">0</b><span>Streak 🔥</span></div>
<div class="stat"><b id="best">0</b><span>Best streak</span></div>
</div>
<div class="card">
<p class="prompt" id="prompt"></p>
<div id="stage"></div>
<div class="opts" id="opts"></div>
<p class="msg" id="msg"></p>
<button class="next" id="next">Next →</button>
</div>
<p class="foot">Each correct answer is worth 10 points, plus 2 bonus points for every answer in your streak.</p>
<p class="foot" id="offline"></p>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
